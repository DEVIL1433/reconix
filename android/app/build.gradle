plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.devil.reconix"
    compileSdk 34


    defaultConfig {
        applicationId "com.devil.reconix"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            version "3.11"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
