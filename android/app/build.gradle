plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.devil.reconix"
    compileSdk 34

    signingConfigs {
        // Release signing is intentionally NOT configured here.
        // To build a signed release APK, create your own keystore and
        // add a signingConfigs.release block with your own credentials.
        // Never commit keystore passwords to a repository.
    }

    defaultConfig {
        applicationId "com.devil.reconix"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            version "3.11"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // signingConfig signingConfigs.release  // uncomment after configuring release signing
        }
        release {
            minifyEnabled false
            // signingConfig signingConfigs.release  // uncomment after configuring release signing
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
